name: Pi Loop
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pi-loop:
    name: pi-loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s .agents/loop/tests -v
